# Copy to .github/workflows/claude.yml in any ShockLab-TestHub repo to turn on the PR
# agent there. The repo also needs the ANTHROPIC_API_KEY secret and the Claude GitHub
# App. See "PR agent" in the claude-agents README.

name: Claude PR agent

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  agent:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ShockLab-TestHub/claude-agents/.github/workflows/pr-agent.yml@main
    secrets: inherit
    with:
      # Repo-specific rules on top of the repo's CLAUDE.md. Leave empty if none.
      repo_rules: ""

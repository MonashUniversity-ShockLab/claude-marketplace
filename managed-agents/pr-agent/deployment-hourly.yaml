# Sweeps the org for open PRs. PAUSED: runs are started by
# .github/workflows/refresh-pr-agent-token.yml right after it refreshes GH_TOKEN, hourly
# 8am-8pm Melbourne Mon-Fri. The schedule below is kept for reference only.
agent: ./agent.md
environment_id: ./environment.yaml
vault_ids: [vlt_011CgrkLxBgcaaor8AgM82Q1]   # the shocklab-pr-agent vault (vault.yaml)
budget:
  type: limit
  max_list_cost: {amount: "300", currency: USD}   # hard cap per run: $3.00
schedule: {type: cron, expression: "0 8-20 * * 1-5", timezone: Australia/Melbourne}
initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          Run your sweep of open pull requests in the MonashUniversity-ShockLab org now.
